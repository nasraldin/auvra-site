<!doctype html>
<!-- Share image source (1200 × 630). Open tools/og.html?lang=en|ar and capture the viewport. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #faf9f6; color: #141413; }
    .card { display: grid; grid-template-columns: 1fr 360px; gap: 40px; height: 630px; padding: 0 72px; align-items: center; position: relative; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 56px; height: 56px; border-radius: 13px; }
    .brand span { font-size: 34px; font-weight: 600; }
    h1 { margin-top: 36px; font-size: 68px; line-height: 1.05; letter-spacing: -0.025em; max-width: 12ch; }
    :lang(ar) h1 { letter-spacing: 0; line-height: 1.3; font-size: 64px; }
    p { margin-top: 22px; font-size: 24px; color: #5e5b55; }
    .shot { align-self: start; margin-top: 64px; }
    .shot .phone { width: 340px; rotate: -3deg; }
    :lang(ar) .shot .phone { rotate: 3deg; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <div class="brand"><img src="../assets/app-icon.png" alt=""><span id="name">Auvra</span></div>
      <h1 id="h1"></h1>
      <p id="p"></p>
    </div>
    <div class="shot"><div class="phone"><img id="img" alt=""></div></div>
  </div>
  <script>
    var lang = new URLSearchParams(location.search).get("lang") === "ar" ? "ar" : "en";
    var copy = {
      en: { h1: "Gold prices, with the math shown.", p: "Spot price and per-gram prices for the UAE, Egypt and Saudi Arabia." },
      ar: { h1: "أسعار الذهب، والحساب أمامك.", p: "السعر الفوري وسعر الغرام في الإمارات ومصر والسعودية." }
    }[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.getElementById("h1").textContent = copy.h1;
    document.getElementById("p").textContent = copy.p;
    document.getElementById("img").src = "../assets/screens/" + lang + "/home.webp";
  </script>
</body>
</html>
